<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lenscribe</title>
  <link rel="stylesheet" href="style.css?v=9" />
</head>
<body class="compact-mode">
  <div class="app-container">

    <header class="top-nav">
      <div class="top-buttons">
        <button id="btnCreate" class="btn-nav" type="button" data-i18n="nav.create">Create</button>
        <button id="btnMode" class="btn-nav" type="button" data-i18n="nav.mode.rect">Rectangle</button>
        <button id="btnSettings" class="btn-nav" type="button" data-i18n="nav.settings">Settings</button>
      </div>
    </header>

    <div class="compact-hint" id="compactHint">
      <p data-i18n="hint.compact">Click "Create" to select a screen area</p>
    </div>

    <div class="main-workspace" id="mainView">
      <aside class="toolbar">
        <button id="btnPencil" class="tool-btn active" type="button" data-i18n-title="tool.pencil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
        </button>
        <label class="tool-color-picker" data-i18n-title="tool.color">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
          </svg>
          <input type="color" id="pencilColor" value="#ffffff" />
        </label>
        <button id="btnBlur" class="tool-btn" type="button" data-i18n-title="tool.blur">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8" />
            <circle cx="12" cy="12" r="4.5" />
            <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button id="btnEraser" class="tool-btn" type="button" data-i18n-title="tool.eraser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 21h10" />
            <path d="M20.4 11.4 12.6 3.6a2 2 0 0 0-2.8 0L3.6 9.8a2 2 0 0 0 0 2.8l7.8 7.8a2 2 0 0 0 2.8 0l5.2-5.2a2 2 0 0 0 0-2.8z" />
            <path d="m6.5 12.5 5 5" />
          </svg>
        </button>
        <div class="tool-settings">
          <label class="tool-label" for="strokeSize" data-i18n="tool.thickness">Thickness</label>
          <input type="range" id="strokeSize" min="1" max="40" value="5" data-i18n-title="tool.thickness" />
        </div>
      </aside>

      <div class="canvas-container" id="canvasContainer">
        <div class="canvas-zoom-wrap" id="canvasZoomWrap">
          <div class="canvas-stack" id="canvasStack">
            <canvas id="baseCanvas"></canvas>
            <canvas id="annotationCanvas"></canvas>
          </div>
        </div>
        <div id="strokePreview" class="stroke-preview"></div>
      </div>
    </div>

    <section class="settings-panel" id="settingsView" hidden>
      <h2 class="settings-title" data-i18n="settings.title">Settings</h2>

      <div class="settings-group">
        <label class="settings-label" for="uiLangSelect" data-i18n="settings.language">Interface language</label>
        <select id="uiLangSelect" class="settings-input">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
          <option value="zh">中文</option>
        </select>
        <p class="settings-hint" data-i18n="settings.language.hint">Changes apply immediately</p>
      </div>
    </section>

    <div class="translate-panel">
      <div class="translate-col">
        <div class="lang-header">
          <select id="sourceLang" class="lang-select">
            <option value="ru" data-i18n="lang.ru">Russian</option>
            <option value="en" selected data-i18n="lang.en">English</option>
            <option value="zh" data-i18n="lang.zh">Chinese</option>
            <option value="es" data-i18n="lang.es">Spanish</option>
          </select>
          <div class="lang-actions">
            <button id="btnClearSource" class="icon-btn" type="button" data-i18n-title="action.clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
            <button id="btnCopySource" class="icon-btn" type="button" data-i18n-title="action.copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
          </div>
        </div>
        <textarea id="resultText" class="lang-textarea" data-i18n-placeholder="placeholder.source"></textarea>
      </div>

      <div class="translate-middle">
        <button id="btnSwapLang" class="icon-btn swap-btn" type="button" data-i18n-title="action.swap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3l4 4-4 4" />
            <path d="M20 7H4" />
            <path d="M8 21l-4-4 4-4" />
            <path d="M4 17h16" />
          </svg>
        </button>
        <button id="btnRecognize" class="btn-primary" type="button" data-i18n="recognize.button">Recognize text</button>
      </div>

      <div class="translate-col">
        <div class="lang-header">
          <select id="targetLang" class="lang-select">
            <option value="ru" selected data-i18n="lang.ru">Russian</option>
            <option value="en" data-i18n="lang.en">English</option>
            <option value="zh" data-i18n="lang.zh">Chinese</option>
            <option value="es" data-i18n="lang.es">Spanish</option>
          </select>
          <div class="lang-actions">
            <button id="btnClearTarget" class="icon-btn" type="button" data-i18n-title="action.clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
            <button id="btnCopyTarget" class="icon-btn" type="button" data-i18n-title="action.copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
            </button>
          </div>
        </div>
        <textarea id="translatedText" class="lang-textarea" data-i18n-placeholder="placeholder.target"></textarea>
      </div>
    </div>

    <div class="clipboard-info" id="clipboardInfo"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
